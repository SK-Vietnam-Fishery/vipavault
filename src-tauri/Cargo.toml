[package]
name = "vipavault"
version = "0.1.0"
description = "VipaVault desktop app"
authors = ["VipaVault"]
edition = "2021"

[lib]
name = "vipavault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vipavault"
path = "src/main.rs"
test = false
doc = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
